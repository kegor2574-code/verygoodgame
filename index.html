<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Racer - 3D Дрифт Игра</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #gameCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: block;
        }
        .ui-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Интерфейс GTA 4 стиль */
        .hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            pointer-events: all;
        }
        .hud-top {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .speedometer {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            min-width: 120px;
        }
        .speed-value {
            font-size: 36px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
        }
        .speed-label {
            font-size: 14px;
            color: #888;
        }
        
        .radar {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #4caf50;
            border-radius: 50%;
            width: 140px;
            height: 140px;
            position: relative;
        }
        .radar-circle {
            position: absolute;
            top: 50%; left: 50%;
            width: 100px;
            height: 100px;
            border: 1px solid #4caf50;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .radar-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .minimap {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #2196f3;
            border-radius: 8px;
            width: 180px;
            height: 180px;
            position: relative;
            overflow: hidden;
        }
        .minimap-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        
        .timer {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
        }
        
        .score {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #9c27b0;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 20px;
            color: #ce93d8;
        }
        
        /* Меню */
        .menu {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: all;
        }
        .menu-title {
            font-size: 72px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 30px rgba(255, 68, 68, 0.7);
            margin-bottom: 50px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .menu-btn {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border: none;
            padding: 20px 60px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
        }
        .menu-btn:hover {
            transform: scale 1.1;
            box-shadow: 0 0 30px #ff4444;
        }
        
        .game-over {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .game-over h1 {
            font-size: 80px;
            color: #ff4444;
            margin-bottom: 30px;
        }
        .game-over p {
            font-size: 24px;
            color: #888;
            margin-bottom: 30px;
        }
        
        /* Картинка игры в углу */
        .game-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #ff4444, #880000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 32px;
            text-align: center;
            line-height: 1.2;
            box-shadow: 0 0 20px #ff4444;
        }
        
        /* Счет */
        .score-display {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #9c27b0;
            border-radius: 8px;
            padding: 15px 25px;
            font-size: 24px;
            color: #ce93d8;
        }
        .score-value {
            font-size: 48px;
            font-weight: bold;
            color: #e040fb;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div class="game-logo">DRIFT</div>
        <div class="score-display">
            <div>ОЧКИ</div>
            <div class="score-value" id="scoreValue">0</div>
        </div>
        <div class="ui-overlay">
            <div class="hud-top">
                <div class="timer">ТАЙМЕР: <span id="timer">60</span>s</div>
                <div class="speedometer">
                    <div class="speed-value" id="speed">0</div>
                    <div class="speed-label">КМ/Ч</div>
                </div>
            </div>
        </div>
        <div class="menu" id="menu">
            <div class="menu-title">DRIFT RACER</div>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
                <button class="menu-btn" style="background: linear-gradient(135deg, #4caf50, #2e7d32);">НАСТРОИКИ</button>
            </div>
        </div>
        <div class="game-over" id="gameOver">
            <h1>GAME OVER</h1>
            <p>Ты прокачал свой дрифт!</p>
            <button class="menu-btn" onclick="restartGame()">ИГРАТЬ СНОВА</button>
        </div>
    </div>

    <script>
        // Инициализация игры
        let scene, camera, renderer, controls;
        let car, wheels = [];
        let speed = 0;
        let targetSpeed = 0;
        let gameTime = 60;
        let gameRunning = false;
        let score = 0;
        let driftAngle = 0;
        let lastDriftTime = 0;
        
        // Тачки и управление
        let keys = {};
        let carMesh, carBody, carWheels = [];
        
        init();
        
        function init() {
            // Сцена
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.01);
            
            // Камера
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Рендерер
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            
            // Освещение GTA 4 стиль
            const hemicube = new THREE.HemisphereLight(0xffffff, 0x444466, 1.5);
            scene.add(hemicube);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(-10, 20, -10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            scene.add(dirLight);
            
            const ambient = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambient);
            
            // Гround
            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({
                color: 0x3a3a3a,
                roughness: 0.8,
                metalness: 0.1,
                side: THREE.DoubleSide
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Асфальт с трассой
            for(let i = 0; i < 10; i++) {
                for(let j = 0; j < 10; j++) {
                    const stripGeo = new THREE.PlaneGeometry(8, 200);
                    const stripMat = new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color().setHSL(Math.random() > 0.5 ? 0.6 : 0, 0.7, 0.3),
                        roughness: 0.9
                    });
                    const strip = new THREE.Mesh(stripGeo, stripMat);
                    strip.rotation.x = -Math.PI / 2;
                    strip.position.set(i * 20 - 100, 0.01, j * 20 - 100);
                    ground.add(strip);
                }
            }
            
            // Машина (GTA 4 стиль)
            createCar();
            
            // Обработка изменения размера
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Управление
            window.addEventListener('keydown', (e) => keys[e.code] = true);
            window.addEventListener('keyup', (e) => keys[e.code] = false);
            
            animate();
        }
        
        function createCar() {
            const carGroup = new THREE.Group();
            
            // Корпус машины
            const bodyGeo = new THREE.CylinderGeometry(2, 2, 6, 16, 1);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: 0xff0000,
                roughness: 0.3,
                metalness: 0.2,
                // Эффект GTA стиль
                onBeforeCompile: (shader) => {
                    shader.uniforms.time = { value: 0 };
                    shader.vertexShader = shader.vertexShader.replace(
                        '#include <begin_vertex>',
                        'float time = float(0.0);'
                    );
                }
            });
            carBody = new THREE.Mesh(bodyGeo, bodyMat);
            carBody.castShadow = true;
            carBody.rotation.x = -Math.PI / 2;
            carGroup.add(carBody);
            
            // Крышка
            const roofGeo = new THREE.BoxGeometry(4, 1.5, 1.5);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(0, 1, 0);
            roof.castShadow = true;
            carGroup.add(roof);
            
            // Колеса
            createWheels(carGroup);
            
            // Тень машины на землю
            const shadowGeo = new THREE.CircleGeometry(3, 32);
            const shadowMat = new THREE.MeshStandardMaterial({ 
                color: 0x000000, 
                transparent: true, 
                opacity: 0.4,
                side: THREE.DoubleSide
            });
            const shadow = new THREE.Mesh(shadowGeo, shadowMat);
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.01;
            carGroup.add(shadow);
            
            scene.add(carGroup);
            car = carGroup;
        }
        
        function createWheels(group) {
            const wheelPositions = [
                [-1.5, -0.7, 2],
                [1.5, -0.7, 2],
                [-1.5, -0.7, -2],
                [1.5, -0.7, -2]
            ];
            
            for(let i = 0; i < 4; i++) {
                const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.5, 16);
                const wheelMat = new THREE.MeshStandardMaterial({ 
                    color: 0x222222,
                    roughness: 0.9,
                    metalness: 0.1
                });
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...wheelPositions[i]);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                group.add(wheel);
                wheels.push(wheel);
            }
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if(gameRunning) {
                updateCar();
                updateCamera();
                updateDrift();
                updateTimer();
                updateScore();
            }
            
            renderer.render(scene, camera);
        }
        
        function updateCar() {
            // Управление
            let accelerate = keys['KeyW'] || keys['ArrowUp'];
            let brake = keys['KeyS'] || keys['ArrowDown'];
            let turnLeft = keys['KeyA'] || keys['ArrowLeft'];
            let turnRight = keys['KeyD'] || keys['ArrowRight'];
            
            // Ускорение и торможение
            if(accelerate) {
                targetSpeed += 0.5;
                if(targetSpeed > 180) targetSpeed = 180;
            } else {
                targetSpeed -= 0.3;
                if(targetSpeed < 0) targetSpeed = 0;
            }
            
            if(brake) {
                targetSpeed -= 0.8;
                if(targetSpeed < 0) targetSpeed = 0;
            }
            
            speed = THREE.MathUtils.lerp(speed, targetSpeed, 0.1);
            
            // Поворот
            if(turnLeft) {
                driftAngle = 1 - speed / 180;
                car.rotation.y += 0.05 * (1 - speed / 180);
            }
            if(turnRight) {
                driftAngle = 1 - speed / 180;
                car.rotation.y -= 0.05 * (1 - speed / 180);
            }
            
            // Движение
            const forward = new THREE.Vector3(
                Math.sin(car.rotation.y) * speed * 0.05,
                0,
                Math.cos(car.rotation.y) * speed * 0.05
            );
            car.position.add(forward);
            
            // Ограничение на карту (меньше чем GTA 4)
            if(car.position.x > 80) { car.position.x = 80; }
            if(car.position.x < -80) { car.position.x = -80; }
            if(car.position.z > 80) { car.position.z = 80; }
            if(car.position.z < -80) { car.position.z = -80; }
            
            // Вращение колес
            wheels.forEach(wheel => {
                wheel.rotation.x += speed * 0.02;
            });
            
            // Дрифт
            if(Math.abs(driftAngle) > 0.3 && speed > 30) {
                carBody.material.color.setHex(0xff3333);
                score += Math.floor(speed * 0.1);
                
                // Эффект дрифта
                const particles = [];
                for(let i = 0; i < 5; i++) {
                    const pGeo = new THREE.SphereGeometry(0.3, 8, 8);
                    const pMat = new THREE.MeshStandardMaterial({ 
                        color: 0xff3300,
                        transparent: true,
                        opacity: 0.7
                    });
                    const particle = new THREE.Mesh(pGeo, pMat);
                    particle.position.set(
                        car.position.x + (Math.random() - 0.5) * 4,
                        0.5 + Math.random() * 0.3,
                        car.position.z + (Math.random() - 0.5) * 4
                    );
                    scene.add(particle);
                    particles.push(particle);
                }
                
                setTimeout(() => {
                    particles.forEach(p => {
                        const fade = new THREE.MeshStandardMaterial({
                            color: 0xff3300,
                            transparent: true,
                            opacity: 0.8
                        });
                        let fadeVal = 0.8;
                        const fadeInterval = setInterval(() => {
                            fadeVal -= 0.05;
                            if(fadeVal <= 0) {
                                clearInterval(fadeInterval);
                                scene.remove(p);
                            } else {
                                p.material.opacity = fadeVal;
                            }
                        }, 30);
                    });
                }, 100);
                
                if(Date.now() - lastDriftTime > 500) {
                    score += 50;
                    lastDriftTime = Date.now();
                }
            } else {
                carBody.material.color.setHex(0xff0000);
            }
            driftAngle *= 0.9;
        }
        
        function updateCamera() {
            const targetPos = new THREE.Vector3(
                car.position.x,
                car.position.y + 3,
                car.position.z + 8
            );
            camera.position.lerp(targetPos, 0.1);
            camera.lookAt(car.position.x, car.position.y + 1, car.position.z);
        }
        
        function updateTimer() {
            gameTime -= 0.016;
            document.getElementById('timer').textContent = Math.ceil(gameTime);
            
            if(gameTime <= 0) {
                endGame();
            }
        }
        
        function updateScore() {
            document.getElementById('scoreValue').textContent = score;
        }
        
        function updateDrift() {
            // Показываем угол дрифта
            const driftIndicator = document.getElementById('driftIndicator');
            if(driftIndicator) {
                driftIndicator.style.transform = `scaleX(${Math.abs(driftAngle)})`;
            }
        }
        
        function startGame() {
            document.getElementById('menu').style.display = 'none';
            gameRunning = true;
            gameTime = 60;
            score = 0;
            car.position.set(0, 0, 0);
            car.rotation.y = 0;
        }
        
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            startGame();
        }
        
        function endGame() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'flex';
        }
        
        // Эффект свечения для машины
        const effectCapture = new THREE.EffectComposer(
            new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight)
        );
    </script>
</body>
</html>
